version: '3.8'

services:
  orchestrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.orchestrator
    container_name: moa-swarm-orchestrator
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=INFO
    volumes:
      - ../logs:/app/logs
      - ../config:/app/config
    networks:
      - moa-swarm-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  agent-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    container_name: moa-swarm-agent-1
    environment:
      - AGENT_ID=agent-1
      - AGENT_ROLE=proposer
      - MODEL=glm-4.7-flash
    volumes:
      - ../logs:/app/logs
      - ../config:/app/config
    networks:
      - moa-swarm-net
    restart: unless-stopped
    depends_on:
      orchestrator:
        condition: service_healthy

  agent-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    container_name: moa-swarm-agent-2
    environment:
      - AGENT_ID=agent-2
      - AGENT_ROLE=proposer
      - MODEL=claude-3-opus
    volumes:
      - ../logs:/app/logs
      - ../config:/app/config
    networks:
      - moa-swarm-net
    restart: unless-stopped
    depends_on:
      orchestrator:
        condition: service_healthy

  agent-3:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    container_name: moa-swarm-agent-3
    environment:
      - AGENT_ID=agent-3
      - AGENT_ROLE=proposer
      - MODEL=gpt-4
    volumes:
      - ../logs:/app/logs
      - ../config:/app/config
    networks:
      - moa-swarm-net
    restart: unless-stopped
    depends_on:
      orchestrator:
        condition: service_healthy

  aggregator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    container_name: moa-swarm-aggregator
    environment:
      - AGENT_ID=aggregator
      - AGENT_ROLE=aggregator
      - MODEL=claude-3-opus
    volumes:
      - ../logs:/app/logs
      - ../config:/app/config
    networks:
      - moa-swarm-net
    restart: unless-stopped
    depends_on:
      orchestrator:
        condition: service_healthy

networks:
  moa-swarm-net:
    driver: bridge
